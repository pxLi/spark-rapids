# A workflow to check if generated docs are up to date
name: doc-gen check

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  signoff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Setup java
        uses: actions/setup-java@v1
        with:
          java-version: 1.8

      - name: Check if generated docs are up to date
        run: |
          mvn antrun:run@update_config_docs ${ARGS}
          mvn exec:exec@if_modified_files ${ARGS}
        env:
          ARGS: '-P pre-merge -pl dist'
