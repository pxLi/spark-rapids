name: caller

on:
  pull_request:
    types: [edited]
  pull_request_target:
    types: [edited]

jobs:
  event_check:
    if: ${{ github.event.changes.base.ref.from != '' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo ${{ github.event.changes.base.ref.from }}
    
#   call_signoff-check:
#     needs: [event_check]
#     if: ${{ github.event_name == 'pull_request_target' }}
#     uses: pxLi/spark-rapids/.github/workflows/signoff-check.yml@branch-22.08

  call:
    needs: [event_check]
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    steps:
     - uses: benc-uk/workflow-dispatch@v1
       with:
         workflow: signoff check
         repo: pxLi/spark-rapids
         ref: ${{ github.event.pull_request.head.ref }}
         token: ${{ secrets.PAT }}
         inputs: '{ "pr_num": "${{ github.event.number }}"}'
        
